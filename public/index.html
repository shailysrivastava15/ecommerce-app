<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ShopEasy</title>
<style>
:root{--bg:#f6f7fb;--c:#fff;--tx:#1b1f2a;--mu:#6b7280;--bd:#e5e7eb;--ac:#4f46e5;--er:#dc2626}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,sans-serif}
nav{background:var(--c);border-bottom:1px solid var(--bd);padding:10px 16px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;position:sticky;top:0}
nav b{font-size:18px;margin-right:auto}
main{max-width:1000px;margin:0 auto;padding:16px}
button,input,textarea,select{font:inherit;border:1px solid var(--bd);border-radius:8px;padding:8px 11px;background:var(--c);color:var(--tx)}
button{cursor:pointer}button.p{background:var(--ac);color:#fff;border-color:var(--ac)}button.d{color:var(--er)}button.s{padding:3px 9px;font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.card{background:var(--c);border:1px solid var(--bd);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:6px}
.img{height:120px;border-radius:8px;background:#eef2ff center/cover;display:grid;place-items:center;font-size:40px}
.mu{color:var(--mu);font-size:13px}.price{font-weight:700}
form{display:grid;gap:8px;max-width:420px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.box{background:var(--c);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}
.err{color:var(--er);min-height:20px}.tag{border:1px solid var(--bd);border-radius:99px;padding:1px 9px;font-size:12px}
h2{margin:6px 0 14px}.ov{overflow-x:auto}
</style></head><body>
<nav id="nav"></nav><main id="app"></main>
<script>
const S=k=>JSON.parse(localStorage.getItem(k)||'null');
let token=localStorage.getItem('t'),user=S('u'),cart=S('c')||[],products=[],view='shop',msg='';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const inr=n=>'₹'+Number(n).toLocaleString('en-IN');
async function api(p,m='GET',b){
  const r=await fetch('/api'+p,{method:m,headers:{'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{})},body:b?JSON.stringify(b):undefined});
  const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Request failed');return d}
const saveCart=()=>localStorage.setItem('c',JSON.stringify(cart));
const go=async v=>{view=v;msg='';await render()};

async function render(){
  const n=cart.reduce((a,i)=>a+i.qty,0);
  nav.innerHTML=`<b>🛍️ ShopEasy</b><button data-a="go" data-v="shop">Shop</button><button data-a="go" data-v="cart">Cart (${n})</button>`+
   (user?`${user.role==='admin'?'<button data-a="go" data-v="admin">Admin</button>':''}<button data-a="go" data-v="orders">My orders</button><button data-a="logout">Logout (${esc(user.name)})</button>`:'<button class="p" data-a="go" data-v="login">Login / Register</button>');
  try{products=await api('/products')}catch(e){}
  const V={shop,cart:cartV,login:loginV,orders:ordersV,admin:adminV}[view];
  app.innerHTML=await V();
}
function shop(){return `<h2>Products</h2><div class="grid">${products.map(p=>`<div class="card"><div class="img" style="${p.image_url?`background-image:url('${esc(p.image_url)}')`:''}">${p.image_url?'':'📦'}</div><b>${esc(p.name)}</b><span class="mu">${esc(p.description)}</span><div class="row"><span class="price">${inr(p.price)}</span><span class="mu">${p.stock?p.stock+' left':'Out of stock'}</span></div><button class="p" data-a="add" data-id="${p.id}" ${p.stock?'':'disabled'}>Add to cart</button></div>`).join('')||'<p>No products yet.</p>'}</div>`}
function cartV(){
  const rows=cart.map(i=>{const p=products.find(x=>x.id===i.id);return p&&{p,q:i.qty}}).filter(Boolean);
  const total=rows.reduce((a,r)=>a+r.p.price*r.q,0);
  if(!rows.length)return '<h2>Your cart</h2><p>Cart is empty.</p>';
  return `<h2>Your cart</h2>${rows.map(r=>`<div class="box row"><span><b>${esc(r.p.name)}</b> <span class="mu">${inr(r.p.price)}</span></span><span><button class="s" data-a="dec" data-id="${r.p.id}">−</button> ${r.q} <button class="s" data-a="add" data-id="${r.p.id}">+</button> <button class="s d" data-a="rm" data-id="${r.p.id}">Remove</button></span></div>`).join('')}
  <div class="box"><div class="row"><b>Total</b><b>${inr(total)}</b></div><br>${user?`<form data-f="checkout"><textarea name="address" placeholder="Delivery address" required></textarea><button class="p">Place order</button></form>`:'<button class="p" data-a="go" data-v="login">Login to checkout</button>'}<div class="err">${esc(msg)}</div></div>`}
function loginV(){return `<h2>Login</h2><form data-f="login"><input name="email" type="email" placeholder="Email" required><input name="password" type="password" placeholder="Password" required><button class="p">Login</button></form>
  <h2>Create account</h2><form data-f="register"><input name="name" placeholder="Name" required><input name="email" type="email" placeholder="Email" required><input name="password" type="password" placeholder="Password (6+ chars)" required><button>Register</button></form><div class="err">${esc(msg)}</div>`}
async function ordersV(){
  if(!user)return '<p>Please log in.</p>';
  const o=await api('/orders');
  return `<h2>My orders</h2>${o.map(x=>`<div class="box"><div class="row"><b>Order #${x.id}</b><span class="tag">${x.status}</span></div><div class="mu">${new Date(x.created_at).toLocaleString()} · ${inr(x.total)}</div>${x.items.map(i=>`<div>${esc(i.name)} × ${i.qty}</div>`).join('')}</div>`).join('')||'<p>No orders yet.</p>'}`}
async function adminV(){
  if(!user||user.role!=='admin')return '<p>Admins only.</p>';
  const o=await api('/orders'),ST=['pending','paid','shipped','delivered','cancelled'];
  return `<h2>Admin · Products</h2><div class="box"><form data-f="product"><input type="hidden" name="id"><input name="name" placeholder="Name" required><input name="description" placeholder="Description"><input name="price" type="number" step="0.01" min="0" placeholder="Price" required><input name="stock" type="number" min="0" placeholder="Stock" required><input name="image_url" placeholder="Image URL (optional)"><button class="p">Save product</button></form><div class="err">${esc(msg)}</div></div>
  <div class="ov">${products.map(p=>`<div class="box row"><span><b>${esc(p.name)}</b> ${inr(p.price)} · stock ${p.stock}</span><span><button class="s" data-a="edit" data-id="${p.id}">Edit</button> <button class="s d" data-a="del" data-id="${p.id}">Delete</button></span></div>`).join('')}</div>
  <h2>Admin · Orders</h2>${o.map(x=>`<div class="box"><div class="row"><b>#${x.id} · ${esc(x.customer)} · ${inr(x.total)}</b><select data-st="${x.id}">${ST.map(s=>`<option ${s===x.status?'selected':''}>${s}</option>`).join('')}</select></div><div class="mu">${esc(x.address)}</div>${x.items.map(i=>`<div>${esc(i.name)} × ${i.qty}</div>`).join('')}</div>`).join('')||'<p>No orders.</p>'}`}

const A={
  go:(_,e)=>go(e.dataset.v),
  add:id=>{id=+id;const i=cart.find(c=>c.id===id);i?i.qty++:cart.push({id,qty:1});saveCart();render()},
  dec:id=>{id=+id;const i=cart.find(c=>c.id===id);if(i&&--i.qty<1)cart=cart.filter(c=>c!==i);saveCart();render()},
  rm:id=>{cart=cart.filter(c=>c.id!==+id);saveCart();render()},
  logout:()=>{token=null;user=null;localStorage.removeItem('t');localStorage.removeItem('u');go('shop')},
  del:async id=>{if(confirm('Delete product?')){await api('/products/'+id,'DELETE');render()}},
  edit:id=>{const p=products.find(x=>x.id==id),f=document.querySelector('[data-f=product]');for(const k of['id','name','description','price','stock','image_url'])f.elements[k].value=p[k]??'';scrollTo(0,0)}
};
document.addEventListener('click',e=>{const a=e.target.closest('[data-a]');if(a)A[a.dataset.a](a.dataset.id,a)});
document.addEventListener('change',async e=>{if(e.target.dataset.st){await api(`/orders/${e.target.dataset.st}/status`,'PATCH',{status:e.target.value})}});
document.addEventListener('submit',async e=>{
  e.preventDefault();const f=e.target,d=Object.fromEntries(new FormData(f)),k=f.dataset.f;
  try{
    if(k==='login'||k==='register'){const r=await api('/auth/'+k,'POST',d);token=r.token;user=r.user;localStorage.setItem('t',token);localStorage.setItem('u',JSON.stringify(user));return go('shop')}
    if(k==='checkout'){await api('/orders','POST',{items:cart,address:d.address});cart=[];saveCart();return go('orders')}
    if(k==='product'){const id=d.id;await api(id?'/products/'+id:'/products',id?'PUT':'POST',d);msg='Saved ✓';return render()}
  }catch(err){msg=err.message;render()}
});
render();
</script></body></html>
